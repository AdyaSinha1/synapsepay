name: CI

on:
  push:
    branches: [main, feat/full-website]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests (temp SQLite)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          PERSISTENCE_ENABLED: "true"
        run: python -m pytest tests -q
      - name: Verify Alembic migration
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
        run: |
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build dashboard
        working-directory: frontend
        run: npm run build

  # Phase 6 adds the Playwright e2e job (local backend + frontend, full
  # contract lifecycle in two browser contexts). Placeholder kept here so
  # the job shape is visible in CI from day one.
